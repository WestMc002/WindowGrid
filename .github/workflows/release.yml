# WindowGrid - automatische Bereitstellung als ZIP (WindowGrid.exe + Anleitung.txt)
# Ausloeser: Aenderung dieser Datei auf main oder per Hand ueber "Run workflow"
# (Eingabe der Versionsnummer). Ohne Eingabe gilt die Version aus dem neuesten
# Commit "WindowGrid <Version> - Aenderungen".
# Gibt es das Release zur Version schon, wird nichts neu gebaut, nur der Text aufgefrischt.

name: Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.28.2026.1101)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ver = '${{ github.event.inputs.version }}'
          if(-not $ver) {
            $subj = git log --format=%s | Where-Object { $_ -match '^WindowGrid (\d+\.\d+\.\d+\.\d+)' } | Select-Object -First 1
            if($subj -match '^WindowGrid (\d+\.\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          }
          if($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "keine gueltige Version gefunden: $ver" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if($LASTEXITCODE -eq 0) { "exists=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver existiert bereits - nur Text auffrischen" }
          else { "exists=0" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ver = '${{ steps.ver.outputs.ver }}'
          # neuester Commit, dessen Text die Versionsnummer nennt
          $sha = git log --format=%H -F --grep="$ver" -n 1
          $punkte = @()
          if($sha) {
            $punkte = @(git log -1 --format=%B $sha | Where-Object { $_ -match '^\s*- ' } | ForEach-Object { $_.Trim() })
          }
          $zeilen = New-Object System.Collections.Generic.List[string]
          if($punkte.Count -gt 0) {
            $zeilen.Add('## Änderungen'); $zeilen.Add('')
            foreach($p in $punkte) { $zeilen.Add($p) }
            $zeilen.Add('')
          }
          $zeilen.Add('## Installation')
          $zeilen.Add('')
          $zeilen.Add("- ZIP ``WindowGrid-$ver.zip`` herunterladen und in einen eigenen Ordner mit Schreibrechten entpacken, z. B. ``C:\Tools\WindowGrid`` – WindowGrid speichert seine Einstellungen in ``WindowGrid.ini`` neben der EXE.")
          $zeilen.Add('- `WindowGrid.exe` starten. Das Symbol erscheint im Infobereich neben der Uhr; Linksklick öffnet die Einstellungen.')
          $zeilen.Add('- Erste Schritte: ein Fenster an der Titelleiste ziehen und dabei die Leertaste drücken – das Raster erscheint.')
          $zeilen.Add('- Update: WindowGrid sieht selbst auf GitHub nach neuen Versionen und aktualisiert sich auf Klick (Tray-Menü, Hinweis im Infobereich oder Info-Fenster). Von Hand: WindowGrid beenden und die vorhandene `WindowGrid.exe` ersetzen.')
          $zeilen.Add('- Voraussetzungen: Windows 10 oder 11 mit .NET Framework 4.x (in Windows enthalten).')
          $zeilen.Add('- Ausführliche Beschreibung in `Anleitung.txt` im ZIP.')
          [IO.File]::WriteAllText("$PWD\notes.md", ($zeilen -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content notes.md -Encoding utf8

      - name: Kompilieren
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          @(
            "[assembly: System.Reflection.AssemblyVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyFileVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyInformationalVersion(`"$ver`")]"
            "namespace WindowGrid { public static partial class AppInfo { public const string Version = `"$ver`"; } }"
          ) | Set-Content Quellcode\VersionInfo.cs -Encoding utf8
          New-Item -ItemType Directory -Force Bin | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 /out:Bin\WindowGrid.exe `
            "/win32icon:Resources\WindowGrid.ico" `
            "/resource:Resources\WindowGrid.ico,WindowGrid.ico" `
            "/resource:Resources\GS-Logo.png,GS-Logo.png" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            "/win32manifest:Quellcode\app.manifest" Quellcode\*.cs
          if($LASTEXITCODE -ne 0) { throw 'Kompilieren fehlgeschlagen' }
          (Get-Item Bin\WindowGrid.exe).VersionInfo.FileVersion

      - name: Release anlegen
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          $zip = "WindowGrid-$ver.zip"
          Compress-Archive -Path Bin\WindowGrid.exe, Anleitung.txt -DestinationPath $zip -Force
          gh release create "v$ver" $zip --title "WindowGrid $ver" --notes-file notes.md --target $env:GITHUB_SHA

      - name: Release-Text auffrischen
        if: steps.ver.outputs.exists == '1'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          gh release edit "v$ver" --notes-file notes.md
